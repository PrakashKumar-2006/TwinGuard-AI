[project]
name = "twinguard-ai"
version = "0.1.0"
description = "TwinGuard AI - Digital Twin and Emergency Simulation Platform"
authors = [{ name = "TwinGuard Team" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "networkx>=3.3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

# ------------------------------------------------------------------------------
# Ruff Linter & Formatter Configuration
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"  # Baseline stable bytecode compatibility
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests for isolated functions and schemas",
    "simulation: Core simulation and graph routing validation tests",
    "api: Backend API integration and contract tests",
]

# ------------------------------------------------------------------------------
# Mypy Static Type Checking Configuration
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "scipy.*",
]
ignore_missing_imports = true
